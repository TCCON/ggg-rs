    "description",
    "file_creation",
    "title",
    "data_use_policy",
    "auxiliary_data_description",
    "more_information",
    "tccon_reference",
    "retrieval_reference",
    "contact",
    "data_revision",
    "file_format_information",
    "algorithm_version",
    "file_format_version",
]
copy_if_present = [
    "long_name",
    "location",
    "data_doi",
    "site_reference",
    "data_reference",
    "short_location",
]
