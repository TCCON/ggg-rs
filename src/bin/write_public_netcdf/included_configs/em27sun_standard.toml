include = ["COMMON"]

# For the EM27s, only xco2 is actually tied to the WMO scale,
# hence it is the only one with a scale suffix in the name.
[[xgas]]
xgas = "xco2_x2019"
gas = "co2"
prior_profile = { type = "specified", only_if_first = true, private_name = "prior_1co2", public_name = "prior_co2" }
prior_xgas = { type = "specified", only_if_first = true, private_name = "prior_xco2_x2019", public_name = "prior_xco2" }
ak = { type = "specified", only_if_first = true, private_name = "ak_xco2" }
slant_bin = { type = "specified", private_name = "ak_slant_xco2_bin" }

[[xgas]]
# Not all EM27s have XCO, so we allow it to be optional for EM27s (but not TCCON)
xgas = "xco"
gas = "co"
required = false
xgas_attr_overrides = { wmo_or_analogous_scale = "Not used" }

[discovery]
# Edit from Niki Jacobs for GGG2020.1 support for EM27/SUNs on 21 Aug 2026.
# TODO: test that excluded values from COMMON are inherited - they should be.
#  Also should not need n2o in both the gases and variables, and should be
#  able to remove the xwco2 and xlco2 sections above.
excluded_gases = ["th2o", "fco2", "zco2", "n2o"]
excluded_xgas_variables = ["xo2", "xn2o", "xwco2", "xlco2"]

# ------------------------------------- #
# Additional specific variables to copy #
# ------------------------------------- #

# Not all EM27s will have N2O, so this needs to be optional.
# But all TCCON data needs to have N2O, so we want it to be
# required there.
[[aux]]
private_name = "xn2o_original"
long_name = "column average nitrous oxide mole fraction"
required = false
[aux.attr_overrides]
wmo_or_analogous_scale = "NOAA 2006A"
description = "o2_mean_mole_fraction * column_n2o / column_o2. This variable contains the XN2O values BEFORE the temperature bias reduction is applied but AFTER the new O2 mole fractions were applied. Most users should prefer the 'xn2o' variable over this one."
note = { omit = true }                                                                                                                                                                                                                                                # incorporated the note about the T-dependent bias reduction into the overridden description.

# -------------- #
# Other settings #
# -------------- #
[global_attributes]
must_copy = [
    "source",
    "description",
    "file_creation",
    "auxiliary_data_description",
    "contact",
    "data_revision",
    "file_format_information",
    "algorithm_version",
    "file_format_version",
]

# I put retrieval_reference in the `copy_if_present` list
# just in case that makes it easier for EM27 users to update
# existing files.
copy_if_present = [
    "title",
    "more_information",
    "data_use_policy",
    "long_name",
    "location",
    "data_doi",
    "site_reference",
    "data_reference",
    "short_location",
    "retrieval_reference",
]
